<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GrowControl Dashboard</title>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="tabs">
        <button class="tab active" data-tab="main">Main</button>
        <button class="tab" data-tab="settings">Settings</button>
        <button class="tab" data-tab="logdata">Log data</button>
        <button class="tab" data-tab="watchdog">View watchdog</button>
    </div>
    <div class="tab-content" id="main">
        <div class="fields-row">
            <div class="field" id="field-time">
                <span class="field-label">Time</span>
                <span class="field-value" id="value-time">--:--:--</span>
            </div>
            <div class="field" id="field-temperature">
                <span class="field-label">Temperature</span>
                <span class="field-value" id="value-temperature">--</span>
            </div>
            <div class="field" id="field-humidity">
                <span class="field-label">Humidity</span>
                <span class="field-value" id="value-humidity">--</span>
            </div>
            <div class="field" id="field-humidifier">
                <span class="field-label">Humidifier</span>
                <span class="field-value" id="value-humidifier">--</span>
            </div>
            <div class="field" id="field-watersupplylevel">
                <span class="field-label">Water Supply Level</span>
                <span class="field-value" id="value-watersupplylevel">--</span>
            </div>
            <div class="field" id="field-fan">
                <span class="field-label">Fan</span>
                <span class="field-value" id="value-fan">--</span>
            </div>
            <div class="field" id="field-heater">
                <span class="field-label">Heater</span>
                <span class="field-value" id="value-heater">--</span>
            </div>
            <div class="field" id="field-light">
                <span class="field-label">Light</span>
                <span class="field-value" id="value-light">--</span>
            </div>
        </div>
        <div class="controls-row">
            <div class="control-group">
                <span>Fan</span>
                <button class="toggle auto-btn" id="fan-mode">Auto</button>
                <button class="toggle onoff-btn" id="fan-onoff" disabled>On</button>
            </div>
            <div class="control-group">
                <span>Heater</span>
                <button class="toggle auto-btn" id="heater-mode">Auto</button>
                <button class="toggle onoff-btn" id="heater-onoff" disabled>On</button>
            </div>
            <div class="control-group">
                <span>Humidifier</span>
                <button class="toggle auto-btn" id="humidifier-mode">Auto</button>
                <button class="toggle onoff-btn" id="humidifier-onoff" disabled>On</button>
            </div>
            <div class="control-group">
                <span>Light</span>
                <button class="toggle auto-btn" id="light-mode">Auto</button>
                <button class="toggle onoff-btn" id="light-onoff" disabled>On</button>
            </div>
            <div class="control-group">
                <span>Exhaust Air Fan</span>
                <button class="toggle onoff-btn" id="exhaustfan-onoff">Off</button>
            </div>
        </div>
        <div class="pumps-row">
            <div class="pump-group">
                <span>Pump1</span>
                <span class="pump-label">Last checked:</span>
                <span class="pump-value" id="pump1-lastchecked">--</span>
                <span class="pump-label">Soil moisture:</span>
                <span class="pump-value" id="pump1-soilmoisture">--</span>
                <button class="toggle onoff-btn" id="pump1-onoff">Off</button>
            </div>
            <div class="pump-group">
                <span>Pump2</span>
                <span class="pump-label">Last checked:</span>
                <span class="pump-value" id="pump2-lastchecked">--</span>
                <span class="pump-label">Soil moisture:</span>
                <span class="pump-value" id="pump2-soilmoisture">--</span>
                <button class="toggle onoff-btn" id="pump2-onoff">Off</button>
            </div>
        </div>
    </div>
    <div class="tab-content" id="settings" style="display:none;">
        <h2>Settings</h2>
        <!-- Settings content here -->
    </div>
    <div class="tab-content" id="logdata" style="display:none;">
        <h2>Log Data</h2>
        <!-- Log data content here -->
    </div>
    <div class="tab-content" id="watchdog" style="display:none;">
        <h2>Watchdog</h2>
        <!-- Watchdog content here -->
    </div>
</body>
</html>
